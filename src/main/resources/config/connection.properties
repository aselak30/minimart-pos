# MiniMart POS - Database Connection Configuration
# Edit this file to match your MySQL server settings.
# This file should NOT be committed to version control with real credentials.

db.host=localhost
db.port=3306
db.name=minimart_pos
db.user=pos_user
db.password=

# db.password=PosPass@2025

# Optional: override pool settings
# db.pool.maxSize=10
# db.pool.minIdle=2

# ── Multi-machine sync (UDP multicast) ──────────────────────────────────────
# All machines must be on the same subnet and able to receive multicast packets.
# Change only if you have a custom network setup or multicast conflicts.
sync.multicast.group=239.255.1.1
sync.multicast.port=45678
sync.enabled=true


